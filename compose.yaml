name: tgac-text2sql-open-source
services:
  starrocks:
    image: starrocks/allin1-ubuntu:3.5-latest@sha256:faf5f6b17a301b276b829482af11d350004833dc9162232e1083a2aad0fa8b2a
    command:
      - /bin/bash
      - -c
      - |
        sed -i -E 's/-Xmx[0-9]+[mMgG]/-Xmx1024m/' /data/deploy/starrocks/fe/conf/fe.conf
        echo 'mem_limit = 2G' >> /data/deploy/starrocks/be/conf/be.conf
        exec ./entrypoint.sh
    ports:
      - "127.0.0.1:${DB_PORT:-19030}:9030"
      - "127.0.0.1:18030:8030"
      - "127.0.0.1:18040:8040"
    mem_limit: 4g
    cpus: 2
    volumes:
      - starrocks-fe:/data/deploy/starrocks/fe/meta
      - starrocks-be:/data/deploy/starrocks/be/storage
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h127.0.0.1 -P9030 -uroot -Nse 'SHOW BACKENDS' | grep -q true"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 18
volumes:
  starrocks-fe:
  starrocks-be:
